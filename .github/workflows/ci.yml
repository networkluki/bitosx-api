# Builds the API, runs every test suite against MariaDB, audits the dependencies, and brings the live stack up
# (functional selftest + Production smoke checks) the way the client live suites use it.
#
# Actions are pinned to a commit, not to a tag that can be moved. Database passwords are generated at run time:
# the service containers create a random root password (MARIADB_RANDOM_ROOT_PASSWORD), which the first step reads
# from the container log and masks; tools/devstack generates every other secret.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Build, audit, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore (lock files must match)
        run: dotnet restore BitosX.Api.slnx --locked-mode

      - name: Build (warnings are errors)
        run: dotnet build BitosX.Api.slnx -c Release -warnaserror --no-restore

      - name: Dependency audit
        run: |
          dotnet list BitosX.Api.slnx package --vulnerable --include-transitive | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then exit 1; fi

      - name: Shell scripts (shellcheck)
        run: shellcheck -x tools/devstack/*.sh deploy/scripts/*.sh

  test:
    name: Tests on MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Debian 13 ships 11.8 (production); 12.3 is the newest LTS. 10.11 (Debian 12) cannot run the migrations:
        # it does not know the utf8mb4_0900_ai_ci collation they use.
        mariadb: ["11.8", "12.3"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports:
          - 3408:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read the generated MariaDB root password
        env:
          SERVICE_ID: ${{ job.services.mariadb.id }}
        run: |
          password="$(docker logs "$SERVICE_ID" 2>&1 | sed -n 's/.*GENERATED ROOT PASSWORD: //p' | head -n 1)"
          if [ -z "$password" ]; then echo "::error::the MariaDB service logged no generated root password"; exit 1; fi
          echo "::add-mask::$password"
          echo "BITOSX_DEVSTACK_DB_ROOT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Create the test database and accounts
        env:
          BITOSX_DEVSTACK_EXTERNAL_DB: "1"
          BITOSX_DEVSTACK_DB_PORT: "3408"
          BITOSX_DEVSTACK_MARIADB_IMAGE: mariadb:${{ matrix.mariadb }}
        run: tools/devstack/test-db.sh up --github-env

      - name: Restore (lock files must match)
        run: dotnet restore BitosX.Api.slnx --locked-mode

      - name: Build
        run: dotnet build BitosX.Api.slnx -c Release -warnaserror --no-restore

      # One project after another: the Infrastructure and Api tests reset the same tables.
      - name: Application tests
        run: dotnet test tests/BitosX.Application.Tests -c Release --no-build

      - name: Infrastructure tests
        run: dotnet test tests/BitosX.Infrastructure.Tests -c Release --no-build

      - name: Api tests
        run: dotnet test tests/BitosX.Api.Tests -c Release --no-build

  live:
    name: Live stack (up, selftest, smoke, down)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports:
          - 3407:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      BITOSX_DEVSTACK_EXTERNAL_DB: "1"
      BITOSX_DEVSTACK_DB_PORT: "3407"
      BITOSX_DEVSTACK_MARIADB_IMAGE: mariadb:11.8
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Read the generated MariaDB root password
        env:
          SERVICE_ID: ${{ job.services.mariadb.id }}
        run: |
          password="$(docker logs "$SERVICE_ID" 2>&1 | sed -n 's/.*GENERATED ROOT PASSWORD: //p' | head -n 1)"
          if [ -z "$password" ]; then echo "::error::the MariaDB service logged no generated root password"; exit 1; fi
          echo "::add-mask::$password"
          echo "BITOSX_DEVSTACK_DB_ROOT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Bring the stack up
        run: tools/devstack/up.sh

      - name: Functional selftest (curl + the dev authenticator, the three client variables only)
        run: tools/devstack/selftest.sh

      - name: Production smoke checks
        run: tools/devstack/smoke.sh

      - name: Bring the stack down
        if: always()
        run: tools/devstack/down.sh

      - name: Keep the API logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-stack-logs
          path: tools/devstack/.state/logs
          if-no-files-found: warn
          retention-days: 14
