# api.bitosx.se — Apache reverse proxy in front of the loopback BitosX API (see docs/DEPLOYMENT.md).
#
#   Internet -> Cloudflare (proxied DNS) -> Apache :443 (this file) -> Kestrel http://127.0.0.1:5080
#
# Modules:  a2enmod ssl proxy proxy_http headers remoteip rewrite
# Install:  install -m 0644 deploy/apache/api.bitosx.se.conf /etc/apache2/sites-available/
#           deploy/scripts/update-cloudflare-ips.sh   (writes /etc/apache2/cloudflare-trusted-proxies.conf)
#           a2ensite api.bitosx.se && apachectl -t && systemctl reload apache2
#
# Server-wide settings that cannot live in a virtual host (put them in /etc/apache2/conf-available/security.conf):
#   ServerTokens Prod     # the Server header says only "Apache", no version or OS
#   ServerSignature Off   # no version footer on Apache-generated pages (also set below for this host)
#   TraceEnable Off
#
# CORS is decided by the application alone: this file must never add or rewrite an Access-Control-* header, and it
# forwards OPTIONS and the Origin / Access-Control-Request-* headers untouched. A duplicated or widened header would
# break the browser client or loosen the policy the API enforces.

<VirtualHost *:80>
    ServerName api.bitosx.se
    ServerSignature Off
    # Cloudflare connects over TLS ("Full (strict)"); anything arriving in plain HTTP is sent to https.
    Redirect permanent / https://api.bitosx.se/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.bitosx.se
    ServerSignature Off

    # ---- TLS (Cloudflare origin certificate; "Full (strict)" in Cloudflare) ----
    SSLEngine on
    SSLCertificateFile    /etc/ssl/bitosx/api.bitosx.se.origin.pem
    SSLCertificateKeyFile /etc/ssl/bitosx/api.bitosx.se.origin.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    # Optional, stronger: accept only Cloudflare's Authenticated Origin Pulls client certificate.
    #   SSLVerifyClient require
    #   SSLVerifyDepth 1
    #   SSLCACertificateFile /etc/ssl/bitosx/cloudflare-origin-pull-ca.pem

    # ---- real client address: from Cloudflare only ----
    # CF-Connecting-IP is believed only when the TCP peer is in Cloudflare's published ranges, kept in a file by
    # deploy/scripts/update-cloudflare-ips.sh (never inlined here). From any other peer the header is ignored and
    # the peer address is the client address. (Allowing only Cloudflare to reach :443 at all is the host
    # firewall's job; see DEPLOYMENT.md.)
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxyList /etc/apache2/cloudflare-trusted-proxies.conf

    # ---- normalized forwarding headers for Kestrel ----
    # Kestrel trusts exactly one X-Forwarded-For/-Proto hop from loopback, so Apache replaces whatever the client
    # or Cloudflare sent with exactly one value each: the address derived above, and https.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Server
    RequestHeader unset X-Real-IP
    RequestHeader unset True-Client-IP
    RequestHeader unset CF-Connecting-IP
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"

    # ---- limits ----
    # The largest legitimate body is an envelope upload: 16 MiB decoded (Security:Sync:MaxEnvelopeBytes, its default
    # and maximum) is at most 22,370,648 bytes of JSON, the API's own body limit for that route. Apache enforces the
    # same number, so a larger declared body gets a clean 413 here before any byte is read; Kestrel could not drain
    # it after an early answer (a 401, a 413) and the proxy would report a broken connection (502) instead.
    LimitRequestBody 22370648
    RewriteEngine On
    RewriteCond expr "%{HTTP:Content-Length} -gt 22370648"
    RewriteRule ^ - [R=413,L]
    # Apache answers "Expect: 100-continue" itself instead of forwarding it to Kestrel: with forwarding, an early
    # final answer (a 401 before the body is read) reached the client as a 500.
    Proxy100Continue Off
    # Clients give envelope transfers 120 s; the proxy must wait longer than that for Kestrel.
    ProxyTimeout 150
    ProxyPass        / http://127.0.0.1:5080/ connectiontimeout=5 timeout=150 retry=0
    ProxyPassReverse / http://127.0.0.1:5080/

    # ---- response headers added at the edge (never Access-Control-*) ----
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    Header always unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/api.bitosx.se-error.log
    CustomLog ${APACHE_LOG_DIR}/api.bitosx.se-access.log combined
</VirtualHost>
